name: Generate GIF Storage

on:
  push:
    paths:
      - "storage/gif/**"
      - "scripts/generate-storage.js"
      - ".github/workflows/generate-storage.yml"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate storage.js
        run: node scripts/generate-storage.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add storage/gif storage/storage.js

          git diff --cached --quiet || git commit -m "Update image storage"

          git push