<div class="row">
    <div class="cell preview"><img src="{{filename}}" /></div>
    <div class="cell filename" title="{{filename}}">{{filename}}</div>
    <div class="cell tags"><input name="{{filename}}" class="tags" type="text" value="{{tags}}" placeholder="none" /></div>
    <div class="cell category"><input name="{{filename}}" class="category" type="text" value="{{category}}" placeholder="uncategorized"/></div>
    <div class="cell nsfw"><input name="{{filename}}" class="nsfw" type="checkbox" {{nsfw}}></div>
</div>
