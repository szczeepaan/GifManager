<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./storage/storage.js" defer></script>
    <script src="js/main.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Gif Manager</title>
</head>
<body>
    <div id="tooltip">Copied link!</div>

    <div id="top-bar">
        <div id="input-container">
            <input id="input-search" type="text" placeholder="Search tags or categories...">
            <div id="button-container">
                <label class="toggle-switch">
                    <input id="input-nsfw" type="checkbox">
                    <span class="slider"></span>
                </label>
                <span class="nsfw-label">NSFW</span>
            </div>
        </div>
        <div id="theme-button"></div>
    </div>

    <div id="gifs"></div>
</body>
</html>
